[package]
name = "yesrss"
version = "0.1.0"
edition = "2024"
description = "A small, safe, self-hosted feed reader with a Google Reader-compatible API"
rust-version = "1.88"
repository = "https://github.com/DerekParks/yesrss"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
feed-rs = "3.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
quick-xml = "0.42.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "stream", "http2", "charset"] }
rpassword = "7.5.4"
rust-embed = "8.13.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
url = "2.5.8"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
