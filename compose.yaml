services:
  yesrss:
    image: ghcr.io/derekparks/yesrss:edge
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - yesrss-data:/data
    environment:
      # Set to true when served over HTTPS (e.g. behind Caddy, Traefik, or `tailscale serve`).
      YESRSS_SECURE_COOKIES: "true"
      # Uncomment to subscribe to feeds on your LAN / tailnet.
      # YESRSS_ALLOW_PRIVATE_NETWORKS: "true"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  yesrss-data:
